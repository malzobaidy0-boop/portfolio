<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#321d17">
  <meta name="description" content="تصفّح قائمة أصناف مخبز الأبطال حسب القسم.">
  <title>مخبز الأبطال | قائمة الطعام</title>
  <link rel="stylesheet" href="styles.css">
  <script src="menu.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <a class="brand" href="#">مخبز الأبطال</a>
      <a class="back" href="#home" hidden>الرجوع للقائمة الرئيسية</a>
    </div>
  </header>
  <div id="hero"><img src="images/oven.webp" alt="مخبز الأبطال"></div>
  <main class="wrap">
    <section id="home" aria-labelledby="home-title">
      <div class="intro">
        <h1 id="home-title" tabindex="-1">قائمة الطعام</h1>
        <p>اختر القسم لعرض الأصناف</p>
      </div>
      <nav id="categories" class="category-grid" aria-label="أقسام القائمة"></nav>
    </section>
    <section id="category" aria-labelledby="category-title" hidden>
      <header class="section-heading">
        <h1 id="category-title" tabindex="-1"></h1>
        <p class="count" id="item-count"></p>
      </header>
      <ul class="item-grid" id="items"></ul>
    </section>
  </main>
  <noscript><p class="wrap">فعّل JavaScript لعرض قائمة الطعام.</p></noscript>
</body>
</html>
